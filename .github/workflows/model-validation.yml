name: model-weights-smoke
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/model-validation.yml"
      - "tools/model_smoke.py"
      - "tools/provision_models.py"
      - "tools/model_identity.py"
jobs:
  real-onnx-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV 4.10 isolated runtime for hosted compatibility test
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/konje-cv"
          "$RUNNER_TEMP/konje-cv/bin/python" -m pip install --disable-pip-version-check "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
      - name: Download reviewed exact-checksum research models
        run: "$RUNNER_TEMP/konje-cv/bin/python" tools/provision_models.py --download --models-dir "$RUNNER_TEMP/konje-models" --env-file "$RUNNER_TEMP/konje-model.env"
      - name: Execute detector and recognizer on synthetic blank arrays
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/konje-model.env"
          "$RUNNER_TEMP/konje-cv/bin/python" tools/model_smoke.py
      - name: Note model limitations
        run: echo "This validates ONNX load and synthetic forward passes on x86-64; no face recognition accuracy or ARM64 latency was tested."
