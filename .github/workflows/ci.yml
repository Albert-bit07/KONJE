name: linux-core-tests
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test C++ and simulated interaction
        run: ctest --test-dir build --output-on-failure
      - name: Python evaluation tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate deployment and diagnostic shell scripts
        run: bash -n scripts/setup-pi.sh scripts/validate-pi.sh
      - name: Compile Python source (no model inference)
        run: python3 -m py_compile tools/recognition_worker.py tools/worker_protocol.py tools/evaluate_policy.py tools/opencv_worker.py tools/model_preflight.py tools/model_identity.py
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libsqlite3-dev
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build instrumented binaries
        run: cmake --build build-sanitized --parallel 2
      - name: Exercise core and full mock pipeline repeatedly
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized -R 'konje_core_tests|mock_full_pipeline' --repeat until-fail:8 --output-on-failure --timeout 45
